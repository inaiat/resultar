name: Validate and Release

on:
  pull_request:
  push:
    branches:
      - main
      - beta
      - next

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  validate:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
          run-install: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: packages/check/native/go.mod
          cache-dependency-path: packages/check/native/go.sum

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Check and coverage
        run: vp run check:full

      - name: Build
        run: vp run build

      - name: Package smoke
        run: vp run smoke:package

      - name: Example smoke tests
        run: vp run test:examples

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
          run-install: false
          registry-url: "https://registry.npmjs.org"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: packages/check/native/go.mod
          cache-dependency-path: packages/check/native/go.sum

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Version packages or publish
        uses: changesets/action@v1
        with:
          version: vp run version:packages
          publish: vp run release:publish
          commit: "Version packages"
          title: "Version packages"
          createGithubReleases: false
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
