name: Validate and Release

on:
  pull_request:
  push:
    branches:
      - main
      - beta
      - next

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  validate:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "26"
          cache: true
          run-install: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: packages/check/native/go.mod
          cache-dependency-path: packages/check/native/go.sum

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Check and coverage (JIT enabled)
        run: RESULTAR_JIT=1 vp run check:full

      - name: Test suite with JIT disabled (CSP/Edge fallback)
        run: RESULTAR_JIT=0 vp run test

      - name: Build
        run: vp run build

      - name: Documentation contracts
        run: vp run test:docs

      - name: Package smoke
        run: vp run smoke:package

      - name: Example smoke tests
        run: vp run test:examples

      - name: Agent evaluation graders
        run: vp run test:agents

      - name: VS Code & Cursor extension checks and live LSP tests
        run: vp run check:vscode && vp run build:vscode && vp run test:vscode

      - name: Docs website & playground checks and tests
        timeout-minutes: 5
        run: vp run test:website

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next')
    needs: validate
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "26"
          cache: true
          run-install: false
          registry-url: "https://registry.npmjs.org"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: packages/check/native/go.mod
          cache-dependency-path: packages/check/native/go.sum

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Check Changesets prerelease mode
        if: github.ref == 'refs/heads/next'
        run: |
          node -e 'if (require("./.changeset/pre.json").mode !== "pre") throw new Error("Enter Changesets prerelease mode on next before releasing.")'

      - name: Version packages or publish
        uses: changesets/action@v2.1.2
        with:
          version-script: vp run version:packages
          publish-script: ${{ github.ref == 'refs/heads/next' && 'vp run release:next' || 'vp run release:publish' }}
          commit-message: "Version packages"
          pr-title: "Version packages"
          create-github-releases: false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
