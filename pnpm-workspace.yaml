packages:
  - .
  - benchmarks
  - examples/*
  - packages/*
  - packages/check/native-packages/*

catalog:
  "@nestjs/common": 12.4.2
  "@nestjs/core": 12.4.2
  "@nestjs/platform-fastify": 12.4.2
  "@stryker-mutator/core": 10.1.1
  "@stryker-mutator/vitest-runner": 10.1.1
  "@types/node": 26.6.6
  "@vitest/coverage-v8": 5.1.0
  "@vitest/ui": 5.1.0
  fallow: 3.42.0
  fastify: 5.12.8
  fastify-plugin: 6.0.1
  hono: 4.13.17
  reflect-metadata: 0.2.2
  rxjs: 7.8.2
  typebox: 1.4.6
  vitest: 5.1.0
  vite-plus: 1.5.1
  typescript: 7.0.2
  zod: 4.6.7
  vite: npm:@voidzero-dev/vite-plus-core@1.5.1

allowBuilds:
  esbuild: true

# Keep the runner and its coverage/UI packages aligned with Vite+'s bundled Vitest.
# https://viteplus.dev/guide/migrate#manual-installation-migration
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"

# The Vite+ alias uses its own version instead of the bundled Vite version.
peerDependencyRules:
  allowedVersions:
    vite: "*"
    vitest: "*"
  allowAny:
    - vite
    - vitest

# Stryker 10 still calls compiler APIs (e.g. ts.parseConfigFileTextToJson) removed from TypeScript 7.
packageExtensions:
  "@stryker-mutator/core@10.1.1":
    dependencies:
      typescript: 6.0.3

strictDepBuilds: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
blockExoticSubdeps: true
minimumReleaseAge: 10080 # 1 week
minimumReleaseAgeExclude:
  # Align the Fastify peer used by locally linked integration consumers.
  - fastify
  - "@hono/*"
  - "@nestjs/*"
  - "@fallow-cli/*"
  # Transitive checker used internally by Vite+; not part of resultar-check's public surface.
  - "@oxlint/*"
  - oxlint
  - fallow-type-aware
  - fallow
  - "@types/*"
  - "@types/node"
  - "@typescript/*"
  - typescript
  - "@voidzero-dev/*"
  - vite-plus
  - typebox
  - zod
  - hono
  - "@stryker-mutator/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
  - "@oxc-project/runtime@0.153.0 || 0.154.0"
  - "@oxc-project/types@0.153.0 || 0.154.0"
  - "@yuku-core/binding-android-arm64@0.19.0"
  - "@yuku-core/binding-darwin-arm64@0.19.0"
  - "@yuku-core/binding-darwin-x64@0.19.0"
  - "@yuku-core/binding-freebsd-x64@0.19.0"
  - "@yuku-core/binding-linux-arm-gnu@0.19.0"
  - "@yuku-core/binding-linux-arm-musl@0.19.0"
  - "@yuku-core/binding-linux-arm64-gnu@0.19.0"
  - "@yuku-core/binding-linux-arm64-musl@0.19.0"
  - "@yuku-core/binding-linux-x64-gnu@0.19.0"
  - "@yuku-core/binding-linux-x64-musl@0.19.0"
  - "@yuku-core/binding-win32-arm64@0.19.0"
  - "@yuku-core/binding-win32-x64@0.19.0"
  - "@yuku-toolchain/types@0.19.0"
  - tinybench@6.2.2
  - yuku-core@0.19.0
  - yuku-parser@0.19.0
  - effect@4.0.5
  - "@fastify/cors@11.4.1"
