packages:
  - .
  - benchmarks
  - examples/*
  - packages/*
  - packages/check/native-packages/*

catalog:
  "@stryker-mutator/core": 10.0.0
  "@stryker-mutator/vitest-runner": 10.0.0
  "@types/node": 26.5.1
  "@vitest/coverage-v8": 4.1.11
  "@vitest/ui": 4.1.11
  fallow: 3.25.0
  hono: 4.13.7
  tsx: 4.23.13
  typebox: 1.3.30
  vitest: 4.1.11
  vite-plus: 0.3.1
  typescript: 7.0.2
  zod: 4.6.4

allowBuilds:
  esbuild: true

# Keep the runner and its coverage/UI packages aligned with Vite+'s bundled Vitest.
# https://viteplus.dev/guide/migrate#manual-installation-migration
overrides:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.1
  vitest: 4.1.11

# The Vite+ alias is versioned 0.3.1 but bundles Vite 8.2.2.
peerDependencyRules:
  allowedVersions:
    "@vitest/mocker@4.1.11>vite": 0.3.1
    "vitest@4.1.11>vite": 0.3.1

# Stryker 10 still calls compiler APIs (e.g. ts.parseConfigFileTextToJson) removed from TypeScript 7.
packageExtensions:
  "@stryker-mutator/core@10.0.0":
    dependencies:
      typescript: 6.0.3

strictDepBuilds: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
blockExoticSubdeps: true
minimumReleaseAge: 10080 # 1 week
minimumReleaseAgeExclude:
  - "@fallow-cli/*"
  # Transitive checker used internally by Vite+; not part of resultar-check's public surface.
  - "@oxlint/*"
  - oxlint
  - fallow-type-aware
  - fallow
  - "@types/*"
  - "@types/node"
  - "@typescript/*"
  - typescript
  - "@voidzero-dev/*"
  - vite-plus
  - typebox
  - zod
  - tsx
  - hono
  - "@stryker-mutator/api@10.0.0"
  - "@stryker-mutator/core@10.0.0"
  - "@stryker-mutator/instrumenter@10.0.0"
  - "@stryker-mutator/util@10.0.0"
  - "@stryker-mutator/vitest-runner@10.0.0"
