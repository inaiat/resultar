packages:
  - .
  - benchmarks
  - examples/*
  - packages/*

catalog:
  "@stryker-mutator/core": 10.0.0
  "@stryker-mutator/vitest-runner": 10.0.0
  "@types/node": 26.2.0
  "@vitest/coverage-v8": 4.1.10
  "@vitest/ui": 4.1.10
  fallow: 3.17.0
  oxlint: 1.78.0
  tsx: 4.23.12
  typebox: 1.3.15
  vitest: 4.1.10
  vite-plus: 0.2.9
  typescript: 7.0.2
  zod: 4.4.3

allowBuilds:
  esbuild: true

peerDependencyRules:
  allowedVersions:
    "@voidzero-dev/vite-plus-core>typescript": 7.0.2

# Stryker 9 still calls the stable compiler API removed from TypeScript 7.
packageExtensions:
  "@stryker-mutator/core@10.0.0":
    dependencies:
      typescript: 6.0.3

strictDepBuilds: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
blockExoticSubdeps: true
minimumReleaseAge: 10080 # 1 week
minimumReleaseAgeExclude:
  - "@fallow-cli/*"
  - fallow-type-aware
  - fallow
  - "@oxlint/*"
  - oxlint
  - "@types/*"
  - "@types/node"
  - "@typescript/*"
  - typescript
  - "@voidzero-dev/*"
  - vite-plus
  - typebox
  - zod
  - tsx
  - '@stryker-mutator/api@10.0.0'
  - '@stryker-mutator/core@10.0.0'
  - '@stryker-mutator/instrumenter@10.0.0'
  - '@stryker-mutator/util@10.0.0'
  - '@stryker-mutator/vitest-runner@10.0.0'
