packages:
  - .
  - benchmarks
  - examples/*
  - packages/*

catalog:
  "@stryker-mutator/core": 9.6.1
  "@stryker-mutator/vitest-runner": 9.6.1
  "@types/node": 26.0.0
  "@vitest/coverage-v8": 4.1.9
  "@vitest/ui": 4.1.9
  fallow: 2.103.0
  typescript-7: npm:typescript@rc
  tsx: 4.22.4
  typebox: 1.3.3
  vitest: 4.1.9
  vite-plus: 0.2.1
  zod: 4.4.3

allowBuilds:
  esbuild: true

strictDepBuilds: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
blockExoticSubdeps: true
minimumReleaseAge: 10080 # 1 week
minimumReleaseAgeExclude:
