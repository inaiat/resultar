packages:
  - .
  - benchmarks
  - examples/*
  - packages/*
  - packages/check/native-packages/*

catalog:
  "@stryker-mutator/core": 10.0.0
  "@stryker-mutator/vitest-runner": 10.0.0
  "@types/node": 26.5.0
  "@vitest/coverage-v8": 4.1.11
  "@vitest/ui": 4.1.11
  fallow: 3.23.0
  hono: 4.13.7
  tsx: 4.23.13
  typebox: 1.3.28
  vitest: 4.1.11
  vite-plus: 0.3.0
  typescript: 7.0.2
  zod: 4.5.4

allowBuilds:
  esbuild: true

peerDependencyRules:
  allowedVersions:
    "@voidzero-dev/vite-plus-core>typescript": 7.0.2

# Stryker 10 still calls compiler APIs (e.g. ts.parseConfigFileTextToJson) removed from TypeScript 7.
packageExtensions:
  "@stryker-mutator/core@10.0.0":
    dependencies:
      typescript: 6.0.3

strictDepBuilds: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
blockExoticSubdeps: true
minimumReleaseAge: 10080 # 1 week
minimumReleaseAgeExclude:
  - "@fallow-cli/*"
  # Transitive checker used internally by Vite+; not part of resultar-check's public surface.
  - "@oxlint/*"
  - oxlint
  - fallow-type-aware
  - fallow
  - "@types/*"
  - "@types/node"
  - "@typescript/*"
  - typescript
  - "@voidzero-dev/*"
  - vite-plus
  - typebox
  - zod
  - tsx
  - hono
  - "@stryker-mutator/api@10.0.0"
  - "@stryker-mutator/core@10.0.0"
  - "@stryker-mutator/instrumenter@10.0.0"
  - "@stryker-mutator/util@10.0.0"
  - "@stryker-mutator/vitest-runner@10.0.0"
