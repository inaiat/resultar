packages:
  - .
  - benchmarks
  - examples/*
  - packages/*
  - packages/check/native-packages/*

catalog:
  "@stryker-mutator/core": 10.0.0
  "@stryker-mutator/vitest-runner": 10.0.0
  "@types/node": 26.6.4
  "@vitest/coverage-v8": 5.0.3
  "@vitest/ui": 5.0.3
  fallow: 3.32.0
  fastify: 5.12.5
  fastify-plugin: 6.0.0
  hono: 4.13.13
  tsx: 4.23.15
  typebox: 1.3.36
  vitest: 5.0.3
  vite-plus: 1.1.0
  typescript: 7.0.2
  zod: 4.6.5
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0

allowBuilds:
  esbuild: true

# Keep the runner and its coverage/UI packages aligned with Vite+'s bundled Vitest.
# https://viteplus.dev/guide/migrate#manual-installation-migration
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"

# The Vite+ alias uses its own version instead of the bundled Vite version.
peerDependencyRules:
  allowedVersions:
    vite: "1.1.0"

# Stryker 10 still calls compiler APIs (e.g. ts.parseConfigFileTextToJson) removed from TypeScript 7.
packageExtensions:
  "@stryker-mutator/core@10.0.0":
    dependencies:
      typescript: 6.0.3

strictDepBuilds: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
blockExoticSubdeps: true
minimumReleaseAge: 10080 # 1 week
minimumReleaseAgeExclude:
  # Align the Fastify peer used by locally linked integration consumers.
  - "fastify@5.12.4"
  - "@fallow-cli/*"
  # Transitive checker used internally by Vite+; not part of resultar-check's public surface.
  - "@oxlint/*"
  - oxlint
  - fallow-type-aware
  - fallow
  - "@types/*"
  - "@types/node"
  - "@typescript/*"
  - typescript
  - "@voidzero-dev/*"
  - vite-plus
  - typebox
  - zod
  - tsx
  - hono
  - "@stryker-mutator/api@10.0.0"
  - "@stryker-mutator/core@10.0.0"
  - "@stryker-mutator/instrumenter@10.0.0"
  - "@stryker-mutator/util@10.0.0"
  - "@stryker-mutator/vitest-runner@10.0.0"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
  - "@oxc-project/runtime@0.153.0"
  - "@oxc-project/types@0.153.0"
# Stryker 10 must use Vitest 5's full-name separator in both test filters and coverage IDs.
# https://vitest.dev/config/testnamepattern
patchedDependencies:
  '@stryker-mutator/vitest-runner@10.0.0': patches/@stryker-mutator__vitest-runner@10.0.0.patch
