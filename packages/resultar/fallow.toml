entry = ["src/index.ts"]
publicPackages = ["resultar"]
# Stryker loads its runner by name; vitest is the alias target in
# vitest-stryker.config.ts, which is excluded from entry analysis below.
ignoreDependencies = ["@stryker-mutator/vitest-runner", "vitest"]
ignorePatterns = [
  "*.config.cjs",
  "*.config.cts",
  "*.config.js",
  "*.config.mjs",
  "*.config.mts",
  "*.config.ts",
  "*.conf.cjs",
  "*.conf.cts",
  "*.conf.js",
  "*.conf.json",
  "*.conf.mjs",
  "*.conf.mts",
  "*.conf.ts",
]

ignoreUnresolvedImports = [
  # Test fixture computes the workspace directory with new URL("../../..", import.meta.url).
  "../../..",
]

[rules]
circular-dependencies = "error"
boundary-violation = "error"
unused-class-members = "off"

[duplicates]
# Do not force wrapper extraction for small hot-path blocks; report larger clones.
minLines = 18
ignore = ["tests/**"]

[health]
ignore = ["tests/**"]
