entry = ["src/index.ts"]
publicPackages = ["resultar-request-zod"]
ignoreDependencies = ["resultar-check"]

[rules]
circular-dependencies = "error"
boundary-violation = "error"
unused-class-members = "off"
duplicate-export-alias = "off"

[duplicates]
minLines = 18
ignore = ["tests/**"]

[health]
ignore = ["tests/**"]
